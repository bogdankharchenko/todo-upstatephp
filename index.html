<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Todo App - Alpine.js</title>
	
	<script src="https://cdn.tailwindcss.com"></script>
	<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<script>
	tailwind.config = {
		darkMode: 'class', 
	}
	</script>
	<style>
	.todo-item {
		transition: all 0.3s ease;
	}
	
	.todo-item.completed {
		opacity: 0.6;
	}
	
	.todo-item.completed .todo-text {
		text-decoration: line-through;
	}
	</style>
</head>
<body class="antialiased bg-gray-50 dark:bg-gray-900">
<div class="min-h-screen flex items-center justify-center p-4">
	<div x-data="todoApp()" class="w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-xl">
		<div class="p-6 border-b border-gray-200 dark:border-gray-700">
			<h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 text-center">
				Todo App
			</h1>
			
			<div class="space-y-3">
				<div class="flex gap-2">
					<input
							type="text"
							x-model="inputValue"
							@keydown.enter="addTodo()"
							placeholder="What needs to be done?"
							class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
					/>
					<button
							@click="addTodo()"
							class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
					>
						Add Todo
					</button>
				</div>
				<div class="flex gap-2 items-center">
					<input
							type="date"
							x-model="inputDueDate"
							class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white text-sm"
					/>
					<span class="text-sm text-gray-500 dark:text-gray-400">Optional due date</span>
					<button
							x-show="inputDueDate"
							@click="inputDueDate = ''"
							class="px-2 py-1 text-xs text-gray-500 hover:text-red-500 transition-colors"
					>
						Clear
					</button>
				</div>
			</div>
		</div>
		
		<div class="p-6">
			<div class="flex gap-2 mb-4">
				<button
						@click="filter = 'all'"
						:class="filter === 'all' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					All (<span x-text="todos.length"></span>)
				</button>
				<button
						@click="filter = 'active'"
						:class="filter === 'active' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					Active (<span x-text="activeTodoCount"></span>)
				</button>
				<button
						@click="filter = 'completed'"
						:class="filter === 'completed' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					Completed (<span x-text="completedTodoCount"></span>)
				</button>
				<button
						x-show="completedTodoCount > 0"
						@click="clearCompleted()"
						class="ml-auto px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
				>
					Clear Completed
				</button>
			</div>
			
			<div class="space-y-2 max-h-96 overflow-y-auto">
				<template x-if="filteredTodos.length === 0">
					<p class="text-center text-gray-500 dark:text-gray-400 py-8">
						<span x-text="filter === 'completed' ? 'No completed todos' : filter === 'active' ? 'No active todos' : 'No todos yet. Add one above!'"></span>
					</p>
				</template>
				<template x-for="todo in filteredTodos" :key="todo.id">
					<div
							class="todo-item p-3 rounded-lg transition-all"
							:class="{
								'completed': todo.completed,
								'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800': isOverdue(todo) && !todo.completed,
								'bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600': !isOverdue(todo) || todo.completed
							}"
					>
						<div class="flex items-center gap-3">
							<input
									type="checkbox"
									:checked="todo.completed"
									@change="toggleTodo(todo.id)"
									class="w-5 h-5 text-blue-500 rounded focus:ring-blue-500"
							/>
							<div class="flex-1">
								<div class="todo-text text-gray-900 dark:text-white" :class="{'text-red-700 dark:text-red-300': isOverdue(todo) && !todo.completed}" x-text="todo.text"></div>
								<div x-show="todo.dueDate" class="text-xs mt-1" :class="{'text-red-600 dark:text-red-400 font-medium': isOverdue(todo) && !todo.completed, 'text-gray-500 dark:text-gray-400': !isOverdue(todo) || todo.completed}">
									<span x-text="isOverdue(todo) && !todo.completed ? 'Overdue: ' : 'Due: '"></span>
									<span x-text="formatDueDate(todo.dueDate)"></span>
								</div>
							</div>
							<button
									@click="deleteTodo(todo.id)"
									class="px-3 py-1 text-red-500 hover:bg-red-100 dark:hover:bg-red-900 rounded transition-colors"
							>
								Delete
							</button>
						</div>
					</div>
				</template>
			</div>
		</div>
		
		<div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
			<p>
				<span x-text="activeTodoCount"></span> item<span x-text="activeTodoCount !== 1 ? 's' : ''"></span> left
			</p>
		</div>
	</div>
</div>

<script>
function todoApp() {
	return {
		todos: [],
		inputValue: '',
		inputDueDate: '',
		filter: 'all',
		
		init() {
			const savedTodos = localStorage.getItem('todos');
			if (savedTodos) {
				this.todos = JSON.parse(savedTodos);
			}
		},
		
		get filteredTodos() {
			let filtered = this.todos.filter(todo => {
				if (this.filter === 'active') {
					return !todo.completed;
				}
				if (this.filter === 'completed') {
					return todo.completed;
				}
				return true;
			});
			
			// Sort by due date (overdue first, then by due date, then by creation date)
			return filtered.sort((a, b) => {
				// If one has due date and other doesn't, prioritize the one with due date
				if (a.dueDate && !b.dueDate) return -1;
				if (!a.dueDate && b.dueDate) return 1;
				
				// If both have due dates, sort by due date
				if (a.dueDate && b.dueDate) {
					const aDate = new Date(a.dueDate);
					const bDate = new Date(b.dueDate);
					return aDate - bDate;
				}
				
				// If neither have due dates, sort by creation date
				return new Date(a.createdAt) - new Date(b.createdAt);
			});
		},
		
		get activeTodoCount() {
			return this.todos.filter(todo => !todo.completed).length;
		},
		
		get completedTodoCount() {
			return this.todos.filter(todo => todo.completed).length;
		},
		
		addTodo() {
			if (this.inputValue.trim()) {
				const newTodo = {
					id: Date.now(),
					text: this.inputValue,
					completed: false,
					createdAt: new Date().toISOString(),
					dueDate: this.inputDueDate || null
				};
				this.todos.push(newTodo);
				this.inputValue = '';
				this.inputDueDate = '';
				this.saveTodos();
			}
		},
		
		toggleTodo(id) {
			const todo = this.todos.find(t => t.id === id);
			if (todo) {
				todo.completed = !todo.completed;
				this.saveTodos();
			}
		},
		
		deleteTodo(id) {
			this.todos = this.todos.filter(todo => todo.id !== id);
			this.saveTodos();
		},
		
		clearCompleted() {
			this.todos = this.todos.filter(todo => !todo.completed);
			this.saveTodos();
		},
		
		saveTodos() {
			localStorage.setItem('todos', JSON.stringify(this.todos));
		},
		
		isOverdue(todo) {
			if (!todo.dueDate) return false;
			const today = new Date();
			const dueDate = new Date(todo.dueDate);
			today.setHours(23, 59, 59, 999); // End of today
			return dueDate < today;
		},
		
		formatDueDate(dateString) {
			if (!dateString) return '';
			const date = new Date(dateString);
			const today = new Date();
			const tomorrow = new Date(today);
			tomorrow.setDate(tomorrow.getDate() + 1);
			
			// Reset time for comparison
			today.setHours(0, 0, 0, 0);
			tomorrow.setHours(0, 0, 0, 0);
			date.setHours(0, 0, 0, 0);
			
			if (date.getTime() === today.getTime()) {
				return 'Today';
			} else if (date.getTime() === tomorrow.getTime()) {
				return 'Tomorrow';
			} else {
				return date.toLocaleDateString();
			}
		}
	}
}
</script>
</body>
</html>
