<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Todo App - Alpine.js</title>
	
	<script src="https://cdn.tailwindcss.com"></script>
	<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<script>
	tailwind.config = {
		darkMode: 'class',
		theme: {
			extend: {
				fontFamily: {
					sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
				}
			}
		}
	}
	</script>
	<style>
	body {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	}

	.todo-item {
		transition: all 0.15s ease;
	}

	.todo-item.completed {
		opacity: 0.5;
	}

	.todo-item.completed .todo-text {
		text-decoration: line-through;
	}

	button {
		transition: all 0.15s ease;
	}

	input:focus {
		outline: none;
	}
	</style>
</head>
<body class="antialiased bg-white dark:bg-black">
<div class="min-h-screen flex items-center justify-center p-6">
	<div x-data="todoApp()" class="w-full max-w-2xl mx-auto bg-white dark:bg-black border border-gray-200 dark:border-gray-800 rounded-xl shadow-sm">
		<div class="p-8 border-b border-gray-200 dark:border-gray-800">
			<h1 class="text-2xl font-semibold text-black dark:text-white mb-8">
				Tasks
			</h1>

			<div class="flex gap-2">
				<input
						type="text"
						x-model="inputValue"
						@keydown.enter="addTodo()"
						placeholder="Add a new task..."
						class="flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-700 rounded-md focus:border-black dark:focus:border-white bg-white dark:bg-black text-black dark:text-white placeholder-gray-400 dark:placeholder-gray-600"
				/>
				<button
						@click="addTodo()"
						class="px-4 py-2 text-sm bg-black dark:bg-white text-white dark:text-black rounded-md hover:bg-gray-800 dark:hover:bg-gray-100 font-medium"
				>
					Add
				</button>
			</div>
		</div>

		<div class="p-8">
			<div class="flex gap-1 mb-6 border border-gray-200 dark:border-gray-800 rounded-md p-1 bg-gray-50 dark:bg-gray-900">
				<button
						@click="filter = 'all'"
						:class="filter === 'all' ? 'bg-white dark:bg-black text-black dark:text-white shadow-sm' : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'"
						class="flex-1 px-3 py-1.5 text-sm rounded font-medium"
				>
					All <span x-text="todos.length"></span>
				</button>
				<button
						@click="filter = 'active'"
						:class="filter === 'active' ? 'bg-white dark:bg-black text-black dark:text-white shadow-sm' : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'"
						class="flex-1 px-3 py-1.5 text-sm rounded font-medium"
				>
					Active <span x-text="activeTodoCount"></span>
				</button>
				<button
						@click="filter = 'completed'"
						:class="filter === 'completed' ? 'bg-white dark:bg-black text-black dark:text-white shadow-sm' : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'"
						class="flex-1 px-3 py-1.5 text-sm rounded font-medium"
				>
					Completed <span x-text="completedTodoCount"></span>
				</button>
			</div>

			<div class="space-y-1 max-h-96 overflow-y-auto">
				<template x-if="filteredTodos.length === 0">
					<p class="text-center text-gray-400 dark:text-gray-600 py-12 text-sm">
						<span x-text="filter === 'completed' ? 'No completed tasks' : filter === 'active' ? 'No active tasks' : 'No tasks yet'"></span>
					</p>
				</template>
				<template x-for="todo in filteredTodos" :key="todo.id">
					<div
							class="todo-item flex items-center gap-3 p-3 border border-gray-200 dark:border-gray-800 rounded-md hover:border-gray-300 dark:hover:border-gray-700 bg-white dark:bg-black group"
							:class="todo.completed ? 'completed' : ''"
					>
						<input
								type="checkbox"
								:checked="todo.completed"
								@change="toggleTodo(todo.id)"
								class="w-4 h-4 border-2 border-gray-300 dark:border-gray-700 rounded-sm text-black dark:text-white focus:ring-0 focus:ring-offset-0 cursor-pointer"
						/>
						<span class="todo-text flex-1 text-sm text-black dark:text-white" x-text="todo.text"></span>
						<button
								@click="deleteTodo(todo.id)"
								class="opacity-0 group-hover:opacity-100 px-2 py-1 text-xs text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white"
						>
							Delete
						</button>
					</div>
				</template>
			</div>

			<div x-show="completedTodoCount > 0" class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-800">
				<button
						@click="clearCompleted()"
						class="w-full px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white border border-gray-200 dark:border-gray-800 rounded-md hover:border-gray-300 dark:hover:border-gray-700 font-medium"
				>
					Clear Completed Tasks
				</button>
			</div>
		</div>

		<div class="px-8 py-4 border-t border-gray-200 dark:border-gray-800 text-center text-xs text-gray-400 dark:text-gray-600">
			<p>
				<span x-text="activeTodoCount"></span> active task<span x-text="activeTodoCount !== 1 ? 's' : ''"></span>
			</p>
		</div>
	</div>
</div>

<script>
function todoApp() {
	return {
		todos: [],
		inputValue: '',
		filter: 'all',
		
		init() {
			const savedTodos = localStorage.getItem('todos');
			if (savedTodos) {
				this.todos = JSON.parse(savedTodos);
			}
		},
		
		get filteredTodos() {
			return this.todos.filter(todo => {
				if (this.filter === 'active') {
					return !todo.completed;
				}
				if (this.filter === 'completed') {
					return todo.completed;
				}
				return true;
			});
		},
		
		get activeTodoCount() {
			return this.todos.filter(todo => !todo.completed).length;
		},
		
		get completedTodoCount() {
			return this.todos.filter(todo => todo.completed).length;
		},
		
		addTodo() {
			if (this.inputValue.trim()) {
				const newTodo = {
					id: Date.now(),
					text: this.inputValue,
					completed: false,
					createdAt: new Date().toISOString()
				};
				this.todos.push(newTodo);
				this.inputValue = '';
				this.saveTodos();
			}
		},
		
		toggleTodo(id) {
			const todo = this.todos.find(t => t.id === id);
			if (todo) {
				todo.completed = !todo.completed;
				this.saveTodos();
			}
		},
		
		deleteTodo(id) {
			this.todos = this.todos.filter(todo => todo.id !== id);
			this.saveTodos();
		},
		
		clearCompleted() {
			this.todos = this.todos.filter(todo => !todo.completed);
			this.saveTodos();
		},
		
		saveTodos() {
			localStorage.setItem('todos', JSON.stringify(this.todos));
		}
	}
}
</script>
</body>
</html>
