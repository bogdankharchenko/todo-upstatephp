<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Todo App - Alpine.js</title>
	
	<script src="https://cdn.tailwindcss.com"></script>
	<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<script>
	tailwind.config = {
		darkMode: 'class', 
	}
	</script>
	<style>
	.todo-item {
		transition: all 0.3s ease;
	}
	
	.todo-item.completed {
		opacity: 0.6;
	}
	
	.todo-item.completed .todo-text {
		text-decoration: line-through;
	}
	</style>
</head>
<body class="antialiased bg-gray-50 dark:bg-gray-900">
<div class="min-h-screen flex items-center justify-center p-4">
	<div x-data="todoApp()" class="w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-xl">
		<div class="p-6 border-b border-gray-200 dark:border-gray-700">
			<h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 text-center">
				Todo App
			</h1>
			
			<div class="space-y-3">
				<div class="flex gap-2">
					<input
							type="text"
							x-model="inputValue"
							@keydown.enter="addTodo()"
							placeholder="What needs to be done?"
							class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
					/>
					<button
							@click="addTodo()"
							class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
					>
						Add Todo
					</button>
				</div>
				
				<div class="flex gap-4 items-center text-sm">
					<div class="flex items-center gap-2">
						<span class="text-gray-700 dark:text-gray-300">Icon:</span>
						<select x-model="selectedIcon" class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded dark:bg-gray-700 dark:text-white text-sm">
							<option value="">None</option>
							<option value="📝">📝 Note</option>
							<option value="🏠">🏠 Home</option>
							<option value="💼">💼 Work</option>
							<option value="🛒">🛒 Shopping</option>
							<option value="💪">💪 Health</option>
							<option value="📚">📚 Learning</option>
							<option value="🎯">🎯 Goal</option>
							<option value="⭐">⭐ Important</option>
							<option value="🔥">🔥 Urgent</option>
							<option value="💡">💡 Idea</option>
						</select>
					</div>
					
					<div class="flex items-center gap-2">
						<span class="text-gray-700 dark:text-gray-300">Color:</span>
						<div class="flex gap-1">
							<button
								x-for="color in colorOptions"
								:key="color.value"
								@click="selectedColor = color.value"
								:class="selectedColor === color.value ? 'ring-2 ring-offset-1 ring-gray-400' : ''"
								:style="`background-color: ${color.bg}`"
								class="w-6 h-6 rounded-full border border-gray-300 cursor-pointer hover:scale-110 transition-transform"
								:title="color.name"
							></button>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<div class="p-6">
			<div class="flex gap-2 mb-4">
				<button
						@click="filter = 'all'"
						:class="filter === 'all' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					All (<span x-text="todos.length"></span>)
				</button>
				<button
						@click="filter = 'active'"
						:class="filter === 'active' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					Active (<span x-text="activeTodoCount"></span>)
				</button>
				<button
						@click="filter = 'completed'"
						:class="filter === 'completed' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					Completed (<span x-text="completedTodoCount"></span>)
				</button>
				<button
						x-show="completedTodoCount > 0"
						@click="clearCompleted()"
						class="ml-auto px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
				>
					Clear Completed
				</button>
			</div>
			
			<div class="space-y-2 max-h-96 overflow-y-auto">
				<template x-if="filteredTodos.length === 0">
					<p class="text-center text-gray-500 dark:text-gray-400 py-8">
						<span x-text="filter === 'completed' ? 'No completed todos' : filter === 'active' ? 'No active todos' : 'No todos yet. Add one above!'"></span>
					</p>
				</template>
				<template x-for="todo in filteredTodos" :key="todo.id">
					<div
							class="todo-item flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-all border-l-4"
							:class="todo.completed ? 'completed' : ''"
							:style="todo.color ? `border-left-color: ${getColorBg(todo.color)}` : 'border-left-color: transparent'"
					>
						<input
								type="checkbox"
								:checked="todo.completed"
								@change="toggleTodo(todo.id)"
								class="w-5 h-5 text-blue-500 rounded focus:ring-blue-500"
						/>
						<span x-show="todo.icon" class="text-lg" x-text="todo.icon"></span>
						<span class="todo-text flex-1 text-gray-900 dark:text-white" x-text="todo.text"></span>
						<span x-show="todo.color" 
							  class="px-2 py-1 rounded-full text-xs font-medium"
							  :style="`background-color: ${getColorBg(todo.color)}; color: ${getColorText(todo.color)}`"
							  x-text="getColorName(todo.color)">
						</span>
						<button
								@click="deleteTodo(todo.id)"
								class="px-3 py-1 text-red-500 hover:bg-red-100 dark:hover:bg-red-900 rounded transition-colors"
						>
							Delete
						</button>
					</div>
				</template>
			</div>
		</div>
		
		<div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
			<p>
				<span x-text="activeTodoCount"></span> item<span x-text="activeTodoCount !== 1 ? 's' : ''"></span> left
			</p>
		</div>
	</div>
</div>

<script>
function todoApp() {
	return {
		todos: [],
		inputValue: '',
		filter: 'all',
		selectedIcon: '',
		selectedColor: '',
		colorOptions: [
			{ value: 'red', name: 'Red', bg: '#ef4444', text: '#ffffff' },
			{ value: 'orange', name: 'Orange', bg: '#f97316', text: '#ffffff' },
			{ value: 'yellow', name: 'Yellow', bg: '#eab308', text: '#000000' },
			{ value: 'green', name: 'Green', bg: '#22c55e', text: '#ffffff' },
			{ value: 'blue', name: 'Blue', bg: '#3b82f6', text: '#ffffff' },
			{ value: 'purple', name: 'Purple', bg: '#8b5cf6', text: '#ffffff' },
			{ value: 'pink', name: 'Pink', bg: '#ec4899', text: '#ffffff' },
			{ value: 'gray', name: 'Gray', bg: '#6b7280', text: '#ffffff' }
		],
		
		init() {
			const savedTodos = localStorage.getItem('todos');
			if (savedTodos) {
				this.todos = JSON.parse(savedTodos);
			}
		},
		
		get filteredTodos() {
			return this.todos.filter(todo => {
				if (this.filter === 'active') {
					return !todo.completed;
				}
				if (this.filter === 'completed') {
					return todo.completed;
				}
				return true;
			});
		},
		
		get activeTodoCount() {
			return this.todos.filter(todo => !todo.completed).length;
		},
		
		get completedTodoCount() {
			return this.todos.filter(todo => todo.completed).length;
		},
		
		addTodo() {
			if (this.inputValue.trim()) {
				const newTodo = {
					id: Date.now(),
					text: this.inputValue,
					completed: false,
					createdAt: new Date().toISOString(),
					icon: this.selectedIcon,
					color: this.selectedColor
				};
				this.todos.push(newTodo);
				this.inputValue = '';
				this.selectedIcon = '';
				this.selectedColor = '';
				this.saveTodos();
			}
		},
		
		toggleTodo(id) {
			const todo = this.todos.find(t => t.id === id);
			if (todo) {
				todo.completed = !todo.completed;
				this.saveTodos();
			}
		},
		
		deleteTodo(id) {
			this.todos = this.todos.filter(todo => todo.id !== id);
			this.saveTodos();
		},
		
		clearCompleted() {
			this.todos = this.todos.filter(todo => !todo.completed);
			this.saveTodos();
		},
		
		saveTodos() {
			localStorage.setItem('todos', JSON.stringify(this.todos));
		},
		
		getColorBg(colorValue) {
			const color = this.colorOptions.find(c => c.value === colorValue);
			return color ? color.bg : '#6b7280';
		},
		
		getColorText(colorValue) {
			const color = this.colorOptions.find(c => c.value === colorValue);
			return color ? color.text : '#ffffff';
		},
		
		getColorName(colorValue) {
			const color = this.colorOptions.find(c => c.value === colorValue);
			return color ? color.name : 'Default';
		}
	}
}
</script>
</body>
</html>
