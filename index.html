<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Todo App - Alpine.js</title>
	
	<script src="https://cdn.tailwindcss.com"></script>
	<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<script>
	tailwind.config = {
		darkMode: 'class', 
	}
	</script>
	<style>
	.todo-item {
		transition: all 0.3s ease;
	}
	
	.todo-item.completed {
		opacity: 0.6;
	}
	
	.todo-item.completed .todo-text {
		text-decoration: line-through;
	}
	
	.overdue {
		background-color: #fef2f2;
		border-color: #fecaca;
	}
	
	.dark .overdue {
		background-color: #450a0a;
		border-color: #7f1d1d;
	}
	
	.overdue .todo-text,
	.overdue .due-date {
		color: #dc2626;
	}
	
	.dark .overdue .todo-text,
	.dark .overdue .due-date {
		color: #f87171;
	}
	</style>
</head>
<body class="antialiased bg-gray-50 dark:bg-gray-900">
<div class="min-h-screen flex items-center justify-center p-4">
	<div x-data="todoApp()" class="w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-xl">
		<div class="p-6 border-b border-gray-200 dark:border-gray-700">
			<h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 text-center">
				Todo App
			</h1>
			
			<div class="space-y-2">
				<div class="flex gap-2">
					<input
							type="text"
							x-model="inputValue"
							@keydown.enter="addTodo()"
							placeholder="What needs to be done?"
							class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
					/>
					<button
							@click="addTodo()"
							class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
					>
						Add Todo
					</button>
				</div>
				<div class="flex gap-2 items-center">
					<label class="text-sm text-gray-600 dark:text-gray-400">Due Date (optional):</label>
					<input
							type="date"
							x-model="dueDateValue"
							class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white text-sm"
					/>
					<button
							x-show="dueDateValue"
							@click="dueDateValue = ''"
							class="text-xs text-gray-500 hover:text-red-500 transition-colors"
					>
						Clear
					</button>
				</div>
			</div>
		</div>
		
		<div class="p-6">
			<div class="flex gap-2 mb-4">
				<button
						@click="filter = 'all'"
						:class="filter === 'all' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					All (<span x-text="todos.length"></span>)
				</button>
				<button
						@click="filter = 'active'"
						:class="filter === 'active' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					Active (<span x-text="activeTodoCount"></span>)
				</button>
				<button
						@click="filter = 'completed'"
						:class="filter === 'completed' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'"
						class="px-4 py-2 rounded-lg transition-colors"
				>
					Completed (<span x-text="completedTodoCount"></span>)
				</button>
				<button
						x-show="completedTodoCount > 0"
						@click="clearCompleted()"
						class="ml-auto px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
				>
					Clear Completed
				</button>
			</div>
			
			<div class="space-y-2 max-h-96 overflow-y-auto">
				<template x-if="filteredTodos.length === 0">
					<p class="text-center text-gray-500 dark:text-gray-400 py-8">
						<span x-text="filter === 'completed' ? 'No completed todos' : filter === 'active' ? 'No active todos' : 'No todos yet. Add one above!'"></span>
					</p>
				</template>
				<template x-for="todo in filteredTodos" :key="todo.id">
					<div
							class="todo-item flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-all border"
							:class="[
								todo.completed ? 'completed' : '',
								isOverdue(todo) && !todo.completed ? 'overdue' : ''
							]"
					>
						<input
								type="checkbox"
								:checked="todo.completed"
								@change="toggleTodo(todo.id)"
								class="w-5 h-5 text-blue-500 rounded focus:ring-blue-500"
						/>
						<div class="flex-1">
							<div class="todo-text text-gray-900 dark:text-white" x-text="todo.text"></div>
							<div x-show="todo.dueDate" class="due-date text-xs text-gray-500 dark:text-gray-400 mt-1">
								Due: <span x-text="formatDueDate(todo.dueDate)"></span>
								<span x-show="isOverdue(todo) && !todo.completed" class="text-red-600 dark:text-red-400 font-medium">(Overdue)</span>
							</div>
						</div>
						<button
								@click="deleteTodo(todo.id)"
								class="px-3 py-1 text-red-500 hover:bg-red-100 dark:hover:bg-red-900 rounded transition-colors"
						>
							Delete
						</button>
					</div>
				</template>
			</div>
		</div>
		
		<div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
			<p>
				<span x-text="activeTodoCount"></span> item<span x-text="activeTodoCount !== 1 ? 's' : ''"></span> left
			</p>
		</div>
	</div>
</div>

<script>
function todoApp() {
	return {
		todos: [],
		inputValue: '',
		dueDateValue: '',
		filter: 'all',
		
		init() {
			const savedTodos = localStorage.getItem('todos');
			if (savedTodos) {
				this.todos = JSON.parse(savedTodos);
			}
		},
		
		get filteredTodos() {
			let filtered = this.todos.filter(todo => {
				if (this.filter === 'active') {
					return !todo.completed;
				}
				if (this.filter === 'completed') {
					return todo.completed;
				}
				return true;
			});
			
			// Sort by due date: overdue first, then by due date ascending, then items without due dates
			return filtered.sort((a, b) => {
				if (!a.dueDate && !b.dueDate) return 0;
				if (!a.dueDate) return 1;
				if (!b.dueDate) return -1;
				
				const dateA = new Date(a.dueDate);
				const dateB = new Date(b.dueDate);
				const today = new Date();
				today.setHours(0, 0, 0, 0);
				
				const aOverdue = dateA < today && !a.completed;
				const bOverdue = dateB < today && !b.completed;
				
				if (aOverdue && !bOverdue) return -1;
				if (!aOverdue && bOverdue) return 1;
				
				return dateA - dateB;
			});
		},
		
		get activeTodoCount() {
			return this.todos.filter(todo => !todo.completed).length;
		},
		
		get completedTodoCount() {
			return this.todos.filter(todo => todo.completed).length;
		},
		
		addTodo() {
			if (this.inputValue.trim()) {
				const newTodo = {
					id: Date.now(),
					text: this.inputValue,
					completed: false,
					createdAt: new Date().toISOString(),
					dueDate: this.dueDateValue || null
				};
				this.todos.push(newTodo);
				this.inputValue = '';
				this.dueDateValue = '';
				this.saveTodos();
			}
		},
		
		toggleTodo(id) {
			const todo = this.todos.find(t => t.id === id);
			if (todo) {
				todo.completed = !todo.completed;
				this.saveTodos();
			}
		},
		
		deleteTodo(id) {
			this.todos = this.todos.filter(todo => todo.id !== id);
			this.saveTodos();
		},
		
		clearCompleted() {
			this.todos = this.todos.filter(todo => !todo.completed);
			this.saveTodos();
		},
		
		saveTodos() {
			localStorage.setItem('todos', JSON.stringify(this.todos));
		},
		
		isOverdue(todo) {
			if (!todo.dueDate || todo.completed) return false;
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			const dueDate = new Date(todo.dueDate);
			return dueDate < today;
		},
		
		formatDueDate(dateString) {
			if (!dateString) return '';
			const date = new Date(dateString);
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			const tomorrow = new Date(today);
			tomorrow.setDate(tomorrow.getDate() + 1);
			
			if (date.toDateString() === today.toDateString()) {
				return 'Today';
			} else if (date.toDateString() === tomorrow.toDateString()) {
				return 'Tomorrow';
			} else {
				return date.toLocaleDateString();
			}
		}
	}
}
</script>
</body>
</html>
