name: Claude Linear Ticket Automation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  automate-linear-tickets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for branch operations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, curl, openssl, fileinfo, tokenizer
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build:mcp
          npm run build

      - name: Create database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run database migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Clear caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run Claude Code for Linear Automation
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Configure MCP server for Linear integration using Bearer token header
          mcp_config: |
            {
              "mcpServers": {
                "linear": {
                  "command": "npx",
                  "args": [
                    "-y",
                    "mcp-remote",
                    "--header",
                    "Authorization: Bearer ${{ secrets.LINEAR_API_KEY }}",
                    "https://mcp.linear.app/sse"
                  ]
                }
              }
            }

          # Pass Linear API key as environment variable
          claude_env: |
            LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

          # Allow all tools for the automation
          allowed_tools: |
            Bash(*),
            Bash(git:*),
            Bash(gh:*),
            Bash(php:*),
            Bash(composer:*),
            Bash(npm:*),
            Bash(vendor/bin/*),
            Read,
            Write,
            Edit,
            MultiEdit,
            NotebookEdit,
            Glob,
            Grep,
            WebFetch,
            WebSearch,
            TodoWrite,
            ExitPlanMode,
            Task,
            BashOutput,
            KillShell,
            ListMcpResourcesTool,
            ReadMcpResourceTool,
            mcp__linear-server__list_comments,
            mcp__linear-server__create_comment,
            mcp__linear-server__list_cycles,
            mcp__linear-server__get_document,
            mcp__linear-server__list_documents,
            mcp__linear-server__get_issue,
            mcp__linear-server__list_issues,
            mcp__linear-server__create_issue,
            mcp__linear-server__update_issue,
            mcp__linear-server__list_issue_statuses,
            mcp__linear-server__get_issue_status,
            mcp__linear-server__list_issue_labels,
            mcp__linear-server__create_issue_label,
            mcp__linear-server__list_projects,
            mcp__linear-server__get_project,
            mcp__linear-server__create_project,
            mcp__linear-server__update_project,
            mcp__linear-server__list_project_labels,
            mcp__linear-server__list_teams,
            mcp__linear-server__get_team,
            mcp__linear-server__list_users,
            mcp__linear-server__get_user,
            mcp__linear-server__search_documentation

          # Custom instructions for the automation task
          direct_prompt: |
            # Linear Ticket Automation Instructions

            ## CRITICAL: Your Single Task
            You are an automated GitHub Action agent. Your ONLY job is to:
            1. Find ONE ticket in Linear with "Backlog" or "Todo" status
            2. Move it to "In Progress" status immediately
            3. Implement the feature described in that ticket
            4. Create a pull request
            5. Move the ticket to appropriate status when done

            ## Step-by-Step Workflow (FOLLOW EXACTLY)

            ### Step 1: Find ONE Ticket
            - Search for tickets with status "Backlog" or "Todo"
            - Select ONE ticket that is 1-2 points in complexity
            - STOP if no suitable tickets exist - do not proceed

            ### Step 2: Update Linear Status
            - IMMEDIATELY move the selected ticket to "In Progress" status
            - This shows the ticket is being worked on

            ### Step 3: Create Branch
            - Create a new git branch with format: feature/TOD-X-brief-description
            - Switch to this branch

            ### Step 4: Implement the Feature
            - Read the ticket requirements carefully
            - Implement EXACTLY what the ticket asks for
            - Do not add extra features or improvements
            - Follow existing code patterns in the codebase

            ### Step 5: Create Pull Request
            - Commit all changes with clear message
            - Push the branch
            - Create PR with title: "Implement [Ticket Title] (TOD-X)"
            - In PR body, include:
              - Summary of changes
              - Link to Linear ticket
              - "Closes TOD-X"

            ## DO NOT:
            - Work on multiple tickets
            - Format or refactor unrelated code
            - Run extensive linting on unchanged files
            - Add features not requested in the ticket
            - Create documentation unless the ticket specifically asks for it

            ## FOCUS ON:
            - Completing exactly what the ticket asks for
            - Using existing patterns in the codebase
            - Making the minimal necessary changes
            - Getting the PR created successfully

            ## If Something Fails:
            - If no tickets available: Exit gracefully
            - If implementation blocked: Create draft PR with explanation
            - If PR creation fails: Document the error

            Remember: You are working autonomously. Make decisions and proceed. Do not ask for clarification.
